<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>競艇ミカタ</title>
<meta name="description" content="競艇をいろんな角度から。ミカタの予想と、予想が楽しくなる材料">
<meta name="theme-color" content="#102230">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261008a">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="flags" aria-hidden="true"><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><i class="l5"></i><i class="l6"></i></span>
    <h1>競艇ミカタ</h1>
  </div>
  <div class="status">
    <span id="updated" class="upd" role="status">読み込み中</span>
    <label class="day"><span class="sr">日付</span><select id="day"></select></label>
  </div>
</header>

<section id="login" class="login" hidden>
  <form id="login-form" autocomplete="on">
    <h2>パスワードを入力</h2>
    <p>予想データは暗号化しています。この端末で一度入れれば次からは不要です。</p>
    <input type="text" name="username" value="kyotei" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" required>
    <label class="rem"><input type="checkbox" id="remember" checked> この端末で記憶する</label>
    <button type="submit">ひらく</button>
    <p id="login-msg" class="msg" role="status"></p>
  </form>
</section>

<div id="app">
  <div class="scroller" id="scroller">
  <div class="venues" id="venues" role="group" aria-label="場で絞り込む"></div>
  <main>
    <section id="tab-now" class="panel"></section>
    <section id="tab-bets" class="panel" hidden></section>
    <section id="tab-track" class="panel" hidden></section>
    <section id="tab-ura" class="panel" hidden></section>
  </main>
  <footer class="foot">
    <p>予想は過去データからの確率計算で、的中や利益を保証するものではありません。舟券の購入は20歳以上、余裕資金の範囲で。</p>
    <p>データ出典: BOAT RACE 公式サイト<button id="logout" class="link">この端末のパスワードを消す</button></p>
  </footer>
  </div>
  <nav class="tabs" role="tablist" aria-label="表示の切り替え">
    <button role="tab" data-tab="now" aria-selected="true">レース</button>
    <button role="tab" data-tab="bets" aria-selected="false">買い目</button>
    <button role="tab" data-tab="track" aria-selected="false">成績</button>
    <button role="tab" data-tab="ura" aria-selected="false">記事</button>
  </nav>
</div>

<script src="emblems.js"></script>
<script src="replycard.js?v=20261008f"></script>
<script src="app.js?v=20261008d"></script>
</body>
</html>
