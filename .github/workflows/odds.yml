name: 過去オッズ取得(検証用)

on:
  workflow_run:
    workflows: ["過去データ取得"]
    types: [completed]
  workflow_dispatch:
    inputs:
      days:
        description: "直近何日分"
        default: "1200"
  schedule:
    - cron: "7 17 * * *"   # 毎日 2:07 JST、少しずつ埋める

permissions:
  contents: write
  actions: write

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]   # 5つのジョブで分担(公式サイトの応答待ちが長く、1本あたり約0.1回/秒)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          model: "false"
      - name: オッズ取得
        run: python scripts/fetch_odds.py --days "${{ github.event.inputs.days || '1200' }}" --time-limit 3 --shard "${{ matrix.shard }}/5"
      - name: コミット(ほかのジョブとぶつかっても消えないよう、最新の main に足し合わせる)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_odds.sh "過去オッズ(${{ matrix.shard }}/5)"

  next:
    needs: odds
    if: success() || failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          model: "false"
      - name: 残りがあれば続きを起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(python scripts/fetch_odds.py --days "${{ github.event.inputs.days || '1200' }}" --left)
          echo "残り ${LEFT} レース"
          if [ "$LEFT" -gt 50 ]; then gh workflow run odds.yml --ref main -f days="${{ github.event.inputs.days || '1200' }}"; fi
          # 自分で起動した続きの実行(GITHUB_TOKEN)の終了では「荒れ狙いの検証」が自動で動かないので、ここで起動する
          gh workflow run arashi_eval.yml --ref main && echo "荒れ狙いの検証を起動しました"
