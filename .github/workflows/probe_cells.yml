name: 収集する表のセルの形の調査

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - run: python scripts/probe_cells.py
      - name: 調査結果(ページの作りの要約だけ)をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe/cells_summary.json
          git commit -q -m "[CI Skip] probe: 収集する表のセルの形" || echo "no changes"
          bash scripts/push.sh
