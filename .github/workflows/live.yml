name: 直前予想(10分ごと)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 23 * * *"    # 8:00-8:59 JST
    - cron: "*/10 0-14 * * *"  # 9:00-23:59 JST

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: d
        run: echo "today=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: c
        with:
          path: data/cache
          key: features-${{ steps.d.outputs.today }}
      - name: 直前情報とオッズで更新
        if: steps.c.outputs.cache-hit == 'true'
        run: python scripts/predict.py live
      - name: コミット
        if: steps.c.outputs.cache-hit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/previews data/odds_live
          git commit -qm "予想: 直前更新 $(TZ=Asia/Tokyo date +%H:%M)" || exit 0
          git pull --rebase -q && git push -q
