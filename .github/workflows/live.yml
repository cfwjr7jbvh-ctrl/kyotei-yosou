name: 直前予想(5分ごと・常駐)

# GitHub の定期実行は遅れたり飛んだりするので、1回の起動で最長5時間40分動き続け、5分ごとに直前予想を更新する。
# 終わったら自分で次を起動する(6〜22時台)。朝は「朝の予想」の後にも起動される。下の定期実行は保険。
on:
  workflow_dispatch:
  schedule:
    - cron: "45 22 * * *"   # 7:45 JST
    - cron: "15 4 * * *"    # 13:15 JST
    - cron: "45 9 * * *"    # 18:45 JST

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      # 期待値100%以上の買い目の LINE 通知(Secrets に入れたときだけ動く)
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      # 展示速報(scripts/tenji_flash.py)を X に出す鍵。X_AUTOPOST=1 のときだけ出す(x_post.yml と同じ)
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_AUTOPOST: ${{ vars.X_AUTOPOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: d
        run: echo "today=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: features-${{ steps.d.outputs.today }}
      - name: 展示速報の準備(カードを描くブラウザと日本語フォント、X の投稿)
        continue-on-error: true
        run: |
          sudo apt-get install -y -q fonts-noto-cjk fonts-dejavu-core >/dev/null
          pip install -q playwright requests-oauthlib
          python -m playwright install --with-deps chromium >/dev/null
      - name: 5分ごとに直前情報とオッズで更新(展示速報の見張りを横で動かす)
        # ループ中に main に合わせ直すので、実行中のスクリプト自体が書き換わらないよう写しを動かす。
        # 展示速報は1分ごとに対象レースの直前情報を見る(git には触らない。写しのフォルダで動かす)
        env:
          TENJI_DIR: ${{ runner.temp }}/tenji
        run: |
          mkdir -p "$TENJI_DIR" "$RUNNER_TEMP/tenji_app/reports/lab"
          cp -r scripts src "$RUNNER_TEMP/tenji_app/"
          cp reports/lab/tenji.json "$RUNNER_TEMP/tenji_app/reports/lab/" 2>/dev/null || true
          (cd "$RUNNER_TEMP/tenji_app" && nohup python scripts/tenji_flash.py --watch >> "$TENJI_DIR/tenji_log.txt" 2>&1 &)
          cp scripts/live_loop.sh "$RUNNER_TEMP/live_loop.sh" && bash "$RUNNER_TEMP/live_loop.sh" 340 300
      - name: 続きを起動(6〜22時台。手動で取り消したときは起動しない)
        if: success() || failure()
        run: |
          H=$(TZ=Asia/Tokyo date +%-H)
          if [ "$H" -ge 6 ] && [ "$H" -le 22 ]; then
            gh workflow run live.yml --ref main && echo "次の直前予想を起動しました"
          fi
