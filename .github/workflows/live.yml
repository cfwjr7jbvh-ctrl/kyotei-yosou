name: 直前予想(5分ごと・常駐)

# GitHub の定期実行は遅れたり飛んだりするので、1回の起動で最長5時間40分動き続け、5分ごとに直前予想を更新する。
# 終わったら自分で次を起動する(6〜22時台)。朝は「朝の予想」の後にも起動される。下の定期実行は保険。
on:
  workflow_dispatch:
  schedule:
    - cron: "45 22 * * *"   # 7:45 JST
    - cron: "15 4 * * *"    # 13:15 JST
    - cron: "45 9 * * *"    # 18:45 JST

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: d
        run: echo "today=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: features-${{ steps.d.outputs.today }}
      - name: 5分ごとに直前情報とオッズで更新
        # ループ中に main に合わせ直すので、実行中のスクリプト自体が書き換わらないよう写しを動かす
        run: cp scripts/live_loop.sh "$RUNNER_TEMP/live_loop.sh" && bash "$RUNNER_TEMP/live_loop.sh" 340 300
      - name: 続きを起動(6〜22時台)
        if: always()
        run: |
          H=$(TZ=Asia/Tokyo date +%-H)
          if [ "$H" -ge 6 ] && [ "$H" -le 22 ]; then
            gh workflow run live.yml --ref main && echo "次の直前予想を起動しました"
          fi
