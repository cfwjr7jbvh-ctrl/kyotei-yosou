name: データ取得の調査

on:
  workflow_dispatch:
  push:
    paths: ["scripts/probe.py", ".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q p7zip-full lhasa || true
      - run: pip install requests
      - run: python scripts/probe.py
      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "probe: 公式データのサンプル取得" || echo "no changes"
          git pull --rebase
          git push
