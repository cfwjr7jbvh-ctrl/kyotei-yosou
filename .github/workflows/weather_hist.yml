name: 過去の天気をためる

# 24場の過去の天気(1時間ごと: 気圧・湿度・気温・風・雨)を data/weather/archive.csv.gz に。最初は3年分、以後は週1で足りない分だけ
on:
  workflow_dispatch:
  schedule:
    - cron: "40 20 * * 2"   # 毎週水曜 5:40 JST

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pandas numpy
      - run: python scripts/fetch_weather_hist.py
      - name: コミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_files.sh "[CI Skip] data: 過去の天気" data/weather/archive.csv.gz
