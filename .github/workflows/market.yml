name: 市場の言葉(毎朝)

# X で読まれている言葉(Yahoo!リアルタイム検索)・ニュースの見出し・note の新着を数えて reports/market/ に残す。
# 投稿の本文は残さない(言葉の回数と見出しだけ)。x_post.py / ura_auto.py が「今日の言葉」として読む。
on:
  workflow_dispatch:
  schedule:
    - cron: "5 21 * * *"   # 毎日 6:05 JST(予想 6:41・記事タブ 7:40 より前)

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/market_words.py
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_files.sh "[CI Skip] market: 市場の言葉" reports/market/*.json reports/market/*.md
