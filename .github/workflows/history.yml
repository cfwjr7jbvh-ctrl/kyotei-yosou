name: 過去データ取得

on:
  workflow_dispatch:
    inputs:
      start:
        description: "取得開始日 (YYYY-MM-DD)"
        default: "2023-10-01"
      end:
        description: "取得終了日 (空欄なら昨日)"
        default: ""

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -q p7zip-full
      - run: pip install -r requirements.txt
      - name: 番組表・成績をダウンロード
        run: |
          END="${{ github.event.inputs.end }}"
          python scripts/fetch_history.py --start "${{ github.event.inputs.start }}" ${END:+--end $END} --time-limit 5.2
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git commit -m "data: 過去データ取得" || echo "no changes"
          git pull --rebase
          git push
