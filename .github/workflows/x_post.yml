name: X の投稿(下書き or 自動投稿)

# 朝8:20 理論ぶつけ(画像つき)・昼12:10 荒れそうなレース・夜20:00 検証ラボ(火・金)か注目選手カード。大会前: 3投稿のスレッド(手動)。
# 文章と画像は記事タブの「今日のX投稿」と同じ(ura_auto.py が作る)。
# 鍵(Secrets の X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET)と変数 X_AUTOPOST=1 がそろうまでは下書きだけ
# (reports/x_drafts/ に残す)。アプリの「記事」タブ・「荒れそうなレース」からのコピーでも同じ文章が出せる。
on:
  workflow_dispatch:
    inputs:
      what:
        description: "theory / morning / evening / thread / test / stats"
        default: "test"
      key:
        description: "thread のとき: 場コード_初日(例 04_20261013)"
        default: ""
      note_url:
        description: "thread のとき: note の URL(最後の投稿に入れる)"
        default: ""
  schedule:
    - cron: "20 23 * * *"   # 8:20 JST 朝: 今日の理論ぶつけ(記事タブの更新 7:40 のあと)
    - cron: "10 3 * * *"    # 12:10 JST 昼: 今日の荒れそうなレース
    - cron: "0 11 * * *"    # 20:00 JST 夜: 火・金は検証ラボ、ほかの日は注目選手カード
    - cron: "30 13 * * 1,4" # 22:30 JST 月・木: 反応と返信を取る(stats)

permissions:
  contents: write

concurrency:
  group: x_post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_AUTOPOST: ${{ vars.X_AUTOPOST }}
      NOTE_URL: ${{ inputs.note_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests requests-oauthlib cryptography
      - name: 投稿(または下書き)
        run: |
          WHAT="${{ inputs.what }}"
          if [ -z "$WHAT" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=Asia/Tokyo date +%H)
            if [ "$H" -ge 22 ]; then WHAT=stats; elif [ "$H" -lt 10 ]; then WHAT=theory; elif [ "$H" -lt 15 ]; then WHAT=morning; else WHAT=evening; fi
          fi
          mkdir -p reports/x_drafts
          if [ "$WHAT" = "stats" ]; then
            python scripts/x_stats.py 2>&1 | tee reports/x_drafts/last_stats.txt; exit "${PIPESTATUS[0]}"
          fi
          ARGS=("$WHAT"); [ -n "${{ inputs.key }}" ] && ARGS+=(--key "${{ inputs.key }}")
          python scripts/x_post.py "${ARGS[@]}" 2>&1 | tee reports/x_drafts/last_run.txt
          exit "${PIPESTATUS[0]}"
      - name: 下書きと投稿の記録をコミット(失敗しても記録は残す)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_files.sh "[CI Skip] X: 下書き・投稿の記録・反応" reports/x_drafts/* reports/x_stats.json docs/data/x_replies.json reports/published.json
