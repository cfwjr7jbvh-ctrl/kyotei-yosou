name: X の投稿(下書き or 自動投稿)

# 8:20 理論ぶつけ(画像)・12:10 荒れそうなレース・15:30 1枚1ネタ(前の日の投票の答え、画像)・20:00 検証ラボ(火・金)か注目選手カード・
# 21:30 投票(答えは次の日の15:30)。大会の準優・優勝戦は締切の70分前(15分ごとに見て、時間が来たものを出す)。大会前: 3投稿のスレッド(手動)。
# 文章と画像は記事タブの「今日のX投稿」と同じ(ura_auto.py が作る)。
# 鍵(Secrets の X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET)と変数 X_AUTOPOST=1 がそろうまでは下書きだけ
# (reports/x_drafts/ に残す)。アプリの「記事」タブ・「荒れそうなレース」からのコピーでも同じ文章が出せる。
on:
  workflow_dispatch:
    inputs:
      what:
        description: "theory / morning / neta / evening / poll / event / thread / test / stats"
        default: "test"
      key:
        description: "thread のとき: 場コード_初日(例 04_20261013)"
        default: ""
      note_url:
        description: "thread のとき: note の URL(最後の投稿に入れる)"
        default: ""
      dry:
        description: "1 なら投稿せずに文章だけ作る(試し)"
        default: ""
  schedule:
    - cron: "20 23 * * *"   # 8:20 JST 朝: 今日の理論ぶつけ(記事タブの更新 7:40 のあと)
    - cron: "10 3 * * *"    # 12:10 JST 昼: 今日の荒れそうなレース
    - cron: "30 6 * * *"    # 15:30 JST 1枚1ネタ(前の日の投票の答え)
    - cron: "0 11 * * *"    # 20:00 JST 夜: 火・金は検証ラボ、ほかの日は注目選手カード
    - cron: "30 12 * * *"   # 21:30 JST 投票(答えは次の日の15:30)
    - cron: "5,20,35,50 3-13 * * *"  # 12:05〜22:50 JST 大会: ドリーム戦・準優・優勝戦の締切70分前、優勝の速報、1日のまとめ(時間が来たものだけ。無ければ何もしない)
    - cron: "50 14 * * *"   # 23:50 JST 毎日: 表示回数・反応・フォロワー数を取る(stats。返信の一覧は月・木だけ)

permissions:
  contents: write

concurrency:
  group: x_post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_AUTOPOST: ${{ vars.X_AUTOPOST }}
      NOTE_URL: ${{ inputs.note_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests requests-oauthlib cryptography
      - name: 投稿(または下書き)
        run: |
          WHAT="${{ inputs.what }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "20 23 * * *") WHAT=theory ;;
              "10 3 * * *") WHAT=morning ;;
              "30 6 * * *") WHAT=neta ;;
              "0 11 * * *") WHAT=evening ;;
              "30 12 * * *") WHAT=poll ;;
              "50 14 * * *") WHAT=stats ;;
              *) WHAT=event ;;
            esac
          fi
          [ -z "$WHAT" ] && WHAT=test
          mkdir -p reports/x_drafts
          if [ "$WHAT" = "stats" ]; then
            python scripts/x_stats.py 2>&1 | tee reports/x_drafts/last_stats.txt; exit "${PIPESTATUS[0]}"
          fi
          ARGS=("$WHAT"); [ -n "${{ inputs.key }}" ] && ARGS+=(--key "${{ inputs.key }}"); [ "${{ inputs.dry }}" = "1" ] && ARGS+=(--dry)
          LOG=reports/x_drafts/last_run.txt; [ "$WHAT" = "event" ] && LOG=reports/x_drafts/last_event.txt; [ "${{ inputs.dry }}" = "1" ] && LOG=reports/x_drafts/last_dry.txt   # 15分ごとの見回りで朝昼夜の記録を上書きしない
          python scripts/x_post.py "${ARGS[@]}" 2>&1 | tee "$LOG"
          exit "${PIPESTATUS[0]}"
      - name: 下書きと投稿の記録をコミット(失敗しても記録は残す)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_files.sh "[CI Skip] X: 下書き・投稿の記録・反応" reports/x_drafts/* reports/x_stats.json docs/data/x_replies.json reports/published.json
