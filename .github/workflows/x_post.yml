name: X の投稿(下書き or 自動投稿)

# 朝: 今日の荒れそうなレース(文字だけ)。夜: 次のグレードレースの注目選手カード(画像つき)。大会前: 3投稿のスレッド(手動)。
# 鍵(Secrets の X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET)と変数 X_AUTOPOST=1 がそろうまでは下書きだけ
# (reports/x_drafts/ に残す)。アプリの「記事」タブ・「荒れそうなレース」からのコピーでも同じ文章が出せる。
on:
  workflow_dispatch:
    inputs:
      what:
        description: "morning / evening / thread / test"
        default: "test"
      key:
        description: "thread のとき: 場コード_初日(例 04_20261013)"
        default: ""
      note_url:
        description: "thread のとき: note の URL(最後の投稿に入れる)"
        default: ""
  schedule:
    - cron: "40 0 * * *"    # 9:40 JST 朝(荒れそうなレース。朝の予想のあと)
    - cron: "0 11 * * *"    # 20:00 JST 夜(注目選手カード)

permissions:
  contents: write

concurrency:
  group: x_post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_AUTOPOST: ${{ vars.X_AUTOPOST }}
      NOTE_URL: ${{ inputs.note_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests requests-oauthlib cryptography
      - name: 投稿(または下書き)
        run: |
          WHAT="${{ inputs.what }}"
          if [ -z "$WHAT" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            H=$(TZ=Asia/Tokyo date +%H); if [ "$H" -lt 15 ]; then WHAT=morning; else WHAT=evening; fi
          fi
          ARGS=("$WHAT"); [ -n "${{ inputs.key }}" ] && ARGS+=(--key "${{ inputs.key }}")
          python scripts/x_post.py "${ARGS[@]}"
      - name: 下書きと投稿の記録をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_files.sh "[CI Skip] X: 下書き・投稿の記録" reports/x_drafts/*
