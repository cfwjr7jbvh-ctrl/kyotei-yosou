name: 朝の予想(毎日)

on:
  workflow_run:
    workflows: ["モデル学習(毎週)"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "41 21 * * *"   # 毎日 6:41 JST

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: d
        run: echo "today=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: 最近の成績を追加取得
        run: python scripts/fetch_history.py --start "$(TZ=Asia/Tokyo date -d '5 days ago' +%F)"
      - name: 朝の予想と前日の答え合わせ
        run: python scripts/predict.py morning
      - uses: actions/cache/save@v4
        with:
          path: data/cache
          key: features-${{ steps.d.outputs.today }}
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/history
          git commit -qm "予想: ${{ steps.d.outputs.today }} 朝" || echo "no changes"
          git pull --rebase -q && git push -q
      - name: 前日分のオッズを保存(検証用)
        run: |
          python scripts/fetch_odds.py --days 3 --time-limit 0.5
          git add data/odds && git commit -qm "data: オッズ" || echo "no changes"
          git pull --rebase -q && git push -q
